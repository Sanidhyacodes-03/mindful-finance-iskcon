{% extends "base.html" %}

{% block title %}Forgot Password — Spendly{% endblock %}

{% block content %}

<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 42px; height: 42px; font-size: 1.2rem;">◈</div>
            <h1 style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;">Reset Your Password</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your email to receive a password reset link</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="nitish@example.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Send Reset Link →
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Remembered your password? 
            <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Sign in</a>
        </p>
    </div>
</div>

{% endblock %}
