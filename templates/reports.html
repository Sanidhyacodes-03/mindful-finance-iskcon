{% extends "base.html" %}

{% block title %}Reports — ISKCON Shirpur Finance{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">Reports</h1>
        <p class="page-subtitle">Download department expense statements as PDF or CSV, filtered by department and date range.</p>
    </div>
</div>

<div class="card card--spiritual card--animate-in" style="max-width: 600px;">
    <form method="GET" id="reportForm">
        <div class="form-group">
            <label class="form-label">Department</label>
            <select name="department" class="form-select">
                <option value="">All Departments</option>
                {% for d in departments %}
                    <option value="{{ d.id }}">{{ d.icon }} {{ d.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1;">
                <label class="form-label">From Date</label>
                <input type="date" name="start_date" id="reportStartDate" class="form-input" value="{{ default_start }}" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label class="form-label">To Date</label>
                <input type="date" name="end_date" id="reportEndDate" class="form-input" value="{{ default_end }}" required>
            </div>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
            <button type="button" onclick="fillMonthRange(0)" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.3rem 0.7rem;">This Month</button>
            <button type="button" onclick="fillMonthRange(1)" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.3rem 0.7rem;">Last Month</button>
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
            <button type="submit" formaction="{{ url_for('export_report_pdf') }}" class="btn btn-primary" style="flex: 1;">📄 Download PDF</button>
            <button type="submit" formaction="{{ url_for('export_report_csv') }}" class="btn btn-secondary" style="flex: 1;">📊 Download CSV</button>
        </div>
    </form>
</div>

{% endblock %}

{% block scripts %}
<script>
function fillMonthRange(monthsAgo) {
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth() - monthsAgo, 1);
    const firstDay = new Date(target.getFullYear(), target.getMonth(), 1);
    const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0);
    const fmt = (d) => d.toISOString().slice(0, 10);
    document.getElementById('reportStartDate').value = fmt(firstDay);
    document.getElementById('reportEndDate').value = fmt(lastDay);
}
</script>
{% endblock %}
