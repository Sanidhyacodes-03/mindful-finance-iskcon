{% extends "base.html" %}

{% block title %}Create New Password — Spendly{% endblock %}

{% block content %}

<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 42px; height: 42px; font-size: 1.2rem;">◈</div>
            <h1 style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;">Set New Password</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Type your new password below</p>
        </div>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 characters" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Update Password →
            </button>
        </form>
    </div>
</div>

{% endblock %}
